[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netconfig-auditor"
version = "0.1.0"
description = "Audit network device configurations against YAML hardening baselines — scored findings with remediation, for Cisco IOS and extensible to industrial switches."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Laxmikant" }]
keywords = ["network-security", "config-audit", "hardening", "cisco-ios", "CIS-benchmark", "IEC-62443", "OT", "compliance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/goosepacket/netconfig-auditor"
Issues = "https://github.com/goosepacket/netconfig-auditor/issues"

[project.scripts]
ncaudit = "ncaudit.cli:main"

[tool.setuptools]
packages = ["ncaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
