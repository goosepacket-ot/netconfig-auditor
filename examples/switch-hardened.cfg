!
hostname PLANT-ACCESS-SW2
!
aaa new-model
enable secret 9 $9$abcdefghij0123456789ABCDEF
service password-encryption
no ip http server
ip http secure-server
!
ip ssh version 2
!
banner login ^C Authorized access only. Activity is logged. ^C
!
logging host 10.10.2.50
!
ntp authenticate
ntp authentication-key 1 md5 0123456789
!
snmp-server group OTRO v3 priv
!
interface GigabitEthernet0/1
 description PLC line 1
 switchport mode access
 switchport access vlan 20
 switchport port-security
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet0/2
 description spare - disabled
 shutdown
!
line con 0
 exec-timeout 10 0
!
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 login authentication default
!
end
